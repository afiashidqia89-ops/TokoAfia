name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Pasang dependensi
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build produksi
        run: bun run build

      - name: Unggah artefak build
        uses: actions/upload-artifact@v4
        with:
          name: tokokita-build
          path: .next/standalone
          retention-days: 7
