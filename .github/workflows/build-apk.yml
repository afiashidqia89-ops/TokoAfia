name: Build APK

on:
  workflow_dispatch:

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Pasang JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Konfirmasi Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang dependensi
        run: bun install --frozen-lockfile

      - name: Build web (static export)
        run: bun run build:static

      - name: Tambahkan platform Android (Capacitor)
        run: bunx cap add android

      - name: Sinkronkan aset web ke Android
        run: bunx cap sync android

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Salin APK dengan nama rapi
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk TokoKita-debug.apk

      - name: Unggah APK sebagai artefak
        uses: actions/upload-artifact@v4
        with:
          name: TokoKita-APK
          path: TokoKita-debug.apk
          retention-days: 30
